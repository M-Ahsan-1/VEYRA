<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Applicants – VEYRA</title>
    <meta name="theme-color" content="#FAF9F6" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#11132F" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#171A45">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/board.css">
    <link rel="stylesheet" href="css/polish.css">
  <meta name="description" content="VEYRA is an AI powered hiring platform. Recruiters post jobs, screen resumes and generate interview questions, while candidates find roles and apply in minutes." />
  <link rel="icon" type="image/svg+xml" href="/assets/brand/favicon.svg" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="VEYRA" />
  <meta property="og:title" content="Applicants – VEYRA" />
  <meta property="og:description" content="VEYRA is an AI powered hiring platform. Recruiters post jobs, screen resumes and generate interview questions, while candidates find roles and apply in minutes." />
  <meta property="og:url" content="https://veyra-sand.vercel.app/applicants.html" />
  <meta property="og:image" content="https://veyra-sand.vercel.app/assets/brand/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Applicants – VEYRA" />
  <meta name="twitter:description" content="VEYRA is an AI powered hiring platform. Recruiters post jobs, screen resumes and generate interview questions, while candidates find roles and apply in minutes." />
  <meta name="twitter:image" content="https://veyra-sand.vercel.app/assets/brand/og-image.png" />
</head>
<body class="theme-recruiter">
    <script src="js/brand.js"></script>
    <script>showPageLoader(); window.addEventListener('load', hidePageLoader);</script>
    <div id="content" class="d-content">
        <section class="d-panel" aria-label="Job">
            <div class="d-panel-head">
                <div>
                    <h3 id="job-title">Applicants</h3>
                    <p class="sub" id="job-sub">Loading job details…</p>
                </div>
                <a class="btn btn-secondary btn-sm" href="jobs.html"><i data-lucide="arrow-left"></i>Back to jobs</a>
            </div>
            <div id="job-skills"></div>
        </section>

        <div class="ap-stats" id="stats"></div>

        <section class="d-panel" aria-label="Applicant list">
            <div class="d-toolbar" id="toolbar">
                <div class="d-field">
                    <label for="filter-score">Minimum score</label>
                    <input type="number" id="filter-score" min="0" max="100" step="1" placeholder="Any score">
                </div>
                <div class="d-field">
                    <label for="filter-skill">Skill</label>
                    <select id="filter-skill">
                        <option value="">All skills</option>
                    </select>
                </div>
                <div class="d-field">
                    <label for="filter-status">Status</label>
                    <select id="filter-status">
                        <option value="">Any status</option>
                    </select>
                </div>
                <button class="btn btn-secondary btn-sm" id="clear-filters" type="button">Clear filters</button>
                <div class="bd-seg" role="group" aria-label="Applicant view">
                    <button type="button" id="view-table" aria-pressed="true">Table</button>
                    <button type="button" id="view-board" aria-pressed="false">Board</button>
                </div>
                <div class="d-spacer"></div>
                <span class="d-hint" id="select-hint">Select 2 or 3 applicants to compare</span>
                <button class="btn btn-sm" id="compare-btn" type="button" disabled><i data-lucide="git-compare"></i>Compare selected</button>
            </div>
            <p class="sub" id="summary"></p>
            <p class="bd-note hidden" id="board-note">Ranked by AI assessment. You make the final decision.</p>
            <div id="list"></div>
            <div id="board" class="hidden"></div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/illustrations.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/mock.js"></script>
    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/board.js"></script>
    <script src="js/polish.js"></script>
    <script>
        const user = guardPage('recruiter');
        const jobId = Dash.intParam('jobId', 0);

        let job = null;
        let applicants = [];
        let openOverrideId = null;
        const selected = new Set();

        function el(id)
        {
            return document.getElementById(id);
        }

        function fatalList(message, canRetry)
        {
            Board.showList();

            el('toolbar').classList.add('hidden');
            el('stats').innerHTML = '';
            el('summary').textContent = '';

            const list = el('list');

            if (canRetry)
            {
                Dash.failInto(list, message, load);
                return;
            }

            list.innerHTML = Dash.empty('triangle-alert', message, '<a class="btn btn-sm" href="jobs.html"><i data-lucide="arrow-left"></i>Back to jobs</a>');
            Dash.icons();
        }

        function renderJobHead()
        {
            el('job-title').textContent = job.title;

            const place = [job.department, job.location, job.type].filter(Boolean).join(' · ');
            el('job-sub').textContent = (place ? place + ' · ' : '') + 'ranked by effective score, highest first';

            const skills = job.skills || [];

            el('job-skills').innerHTML = skills.length
                ? '<div class="d-group-title">What this job asks for</div><div class="d-chips">' +
                    skills.map(function (item)
                    {
                        return '<span class="d-chip info">' + Dash.esc(item.skill) + ' · ' + Dash.esc(item.requirement) + '</span>';
                    }).join('') +
                    '</div>'
                : '';
        }

        // quick numbers at the top, they count up once when the page loads
        function renderStats()
        {
            const scored = applicants
                .map(function (item) { return item.effectiveScore; })
                .filter(function (value) { return value !== null && value !== undefined; });
            const top = scored.length ? Math.max.apply(null, scored) : 0;
            const strong = scored.filter(function (value) { return value >= 70; }).length;
            const shortlisted = applicants.filter(function (item) { return item.status === 'Shortlisted'; }).length;
            const items = [
                [applicants.length, 'Applicants', true],
                [top, 'Top score', false],
                [strong, 'Strong matches (70 and up)', false],
                [shortlisted, 'Shortlisted', false]
            ];

            el('stats').innerHTML = items.map(function (entry, index)
            {
                return '<div class="ap-stat' + (entry[2] ? ' is-hero' : '') + '" style="--i:' + index + '"><b data-count="' + entry[0] + '">0</b><span>' + entry[1] + '</span></div>';
            }).join('');

            el('stats').querySelectorAll('[data-count]').forEach(function (node)
            {
                Polish.countUp(node, node.getAttribute('data-count'));
            });
        }

        function populateFilters()
        {
            el('filter-skill').innerHTML = '<option value="">All skills</option>' +
                (job.skills || []).map(function (item)
                {
                    return '<option value="' + Dash.esc(item.skill) + '">' + Dash.esc(item.skill) + '</option>';
                }).join('');

            const present = Dash.PIPELINE.filter(function (status)
            {
                return applicants.some(function (item)
                {
                    return item.status === status;
                });
            });

            el('filter-status').innerHTML = '<option value="">Any status</option>' +
                present.map(function (status)
                {
                    return '<option value="' + Dash.esc(status) + '">' + Dash.esc(status) + '</option>';
                }).join('');
        }

        function renderSummary(rows)
        {
            const scores = rows.map(function (item)
            {
                return item.effectiveScore;
            })
            .filter(function (value)
            {
                return value !== null && value !== undefined;
            })
            .sort(function (a, b)
            {
                return a - b;
            });

            let text = rows.length + (rows.length === 1 ? ' applicant' : ' applicants');

            if (scores.length)
            {
                const mid = Math.floor(scores.length / 2);
                const median = scores.length % 2 ? scores[mid] : Math.round((scores[mid - 1] + scores[mid]) / 2);
                text += ' · median score ' + median;
            }
            else
            {
                text += ' · no scores yet';
            }

            if (applicants.length && rows.length !== applicants.length)
            {
                text += ' (filtered from ' + applicants.length + ')';
            }

            el('summary').textContent = text;
        }

        function overrideRowHtml(item)
        {
            const current = item.effectiveScore === null || item.effectiveScore === undefined ? '' : item.effectiveScore;
            const overridden = item.overrideScore !== null && item.overrideScore !== undefined;
            const aiScore = item.score === null || item.score === undefined ? 'not assessed yet' : item.score;

            return '<tr><td colspan="7">' +
                '<div class="d-callout warn"><i data-lucide="scale"></i><div><b>Human override — this decision is audited</b>' +
                '<p>An override replaces the AI score with your own judgement. Your name, the new score and your reason are recorded permanently. A reason of at least 10 characters is required.</p>' +
                (overridden ? '<p>Current override: ' + Dash.esc(item.overrideScore) + ' — ' + Dash.esc(item.overrideReason || 'No reason given.') + '</p>' : '') +
                '</div></div>' +
                '<div class="d-form-grid">' +
                    '<div>' +
                        '<label for="ov-score-' + item.id + '">New score (0 to 100)</label>' +
                        '<input type="number" id="ov-score-' + item.id + '" min="0" max="100" step="1" value="' + current + '">' +
                        '<p class="d-hint">AI score: ' + Dash.esc(aiScore) + '</p>' +
                    '</div>' +
                    '<div>' +
                        '<label for="ov-reason-' + item.id + '">Reason (required)</label>' +
                        '<textarea id="ov-reason-' + item.id + '" placeholder="Explain why this score should change. The candidate never sees this reason.">' + (overridden ? Dash.esc(item.overrideReason || '') : '') + '</textarea>' +
                    '</div>' +
                '</div>' +
                '<div class="form-error hidden" data-ov-error role="alert"></div>' +
                '<div class="row">' +
                    '<button class="btn btn-sm" type="button" data-ov-save="' + item.id + '"><i data-lucide="check"></i>Save override</button>' +
                    '<button class="btn btn-secondary btn-sm" type="button" data-ov-cancel>Cancel</button>' +
                '</div>' +
                '</td></tr>';
        }

        function rowHtml(item, rank, index)
        {
            const overridden = item.overrideScore !== null && item.overrideScore !== undefined;
            const score = item.effectiveScore;
            let scoreCell;

            if (score === null || score === undefined)
            {
                scoreCell = Dash.badge('Not assessed', 'neutral');
            }
            else
            {
                scoreCell = Dash.badge(score, Dash.scoreTone(score));

                if (overridden)
                {
                    scoreCell += ' ' + Dash.badge('Overridden', 'warn');

                    if (item.score !== null && item.score !== undefined)
                    {
                        scoreCell += ' <s class="muted">' + Dash.esc(item.score) + '</s>';
                    }
                }
            }

            // bar colour follows the score so a recruiter can scan the column quickly
            const hasScore = score !== null && score !== undefined;
            const meterTone = score >= 70 ? 'is-ok' : (score >= 40 ? 'is-warn' : 'is-bad');
            const meter = hasScore
                ? '<div class="ap-meter ' + meterTone + '"><i style="--w:' + Math.max(0, Math.min(100, score)) + '%"></i></div>'
                : '';

            return '<tr class="ap-row' + (rank === 1 ? ' ap-top' : '') + '" style="--i:' + index + '">' +
                '<td><input type="checkbox" data-select="' + item.id + '"' +
                    (selected.has(item.id) ? ' checked' : '') +
                    (selected.size >= 3 && !selected.has(item.id) ? ' disabled' : '') +
                    ' aria-label="Select ' + Dash.esc(item.candidateName) + ' for comparison"></td>' +
                '<td><span class="d-rank' + (rank === 1 ? ' top' : '') + '">' + rank + '</span></td>' +
                '<td><div class="ap-who"><span class="jp-avatar" aria-hidden="true">' + Dash.esc(Polish.initials(item.candidateName)) + '</span>' +
                    '<div><strong>' + Dash.esc(item.candidateName) + '</strong><br><span class="muted">' + Dash.esc(item.email) + '</span></div></div></td>' +
                '<td><div class="ap-score"><div class="ap-score-top">' + scoreCell + '</div>' + meter + '</div></td>' +
                '<td>' + Dash.badge(item.status, Dash.statusTone(item.status)) + '</td>' +
                '<td>' + Dash.esc(Dash.formatDate(item.appliedAt)) + '</td>' +
                '<td><div class="row">' +
                    '<a class="btn btn-sm" href="applicant-detail.html?id=' + item.id + '&amp;jobId=' + jobId + '">View</a>' +
                    '<button class="btn btn-secondary btn-sm" type="button" data-override="' + item.id + '">' + (overridden ? 'Edit override' : 'Override') + '</button>' +
                '</div></td>' +
                '</tr>' +
                (openOverrideId === item.id ? overrideRowHtml(item) : '');
        }

        function updateSelectionUI()
        {
            document.querySelectorAll('[data-select]').forEach(function (box)
            {
                const id = Number(box.getAttribute('data-select'));
                box.disabled = selected.size >= 3 && !selected.has(id);
            });

            el('select-hint').textContent = selected.size
                ? selected.size + ' of 3 selected for comparison'
                : 'Select 2 or 3 applicants to compare';

            el('compare-btn').disabled = selected.size < 2;
        }

        function render()
        {
            const list = el('list');
            const minRaw = el('filter-score').value;
            const hasMin = minRaw !== '';
            const min = Number(minRaw);
            const skill = el('filter-skill').value;
            const status = el('filter-status').value;

            const rows = applicants.filter(function (item)
            {
                const score = item.effectiveScore;

                if (hasMin && (score === null || score === undefined || Number(score) < min))
                {
                    return false;
                }

                if (skill)
                {
                    const matched = (item.score_json && item.score_json.matched_skills) || [];
                    const found = matched.some(function (entry)
                    {
                        return String(entry.skill).toLowerCase() === skill.toLowerCase();
                    });

                    if (!found)
                    {
                        return false;
                    }
                }

                if (status && item.status !== status)
                {
                    return false;
                }

                return true;
            });

            renderSummary(rows);
            Board.render(rows, applicants.length);

            if (!applicants.length)
            {
                list.innerHTML = Dash.empty('users', 'No one has applied to this job yet. Applicants appear here as soon as they apply.',
                    '<a class="btn btn-sm" href="jobs.html"><i data-lucide="arrow-left"></i>Back to jobs</a>');
            }
            else if (!rows.length)
            {
                list.innerHTML = Dash.empty('filter', 'No applicants match the current filters.',
                    '<button class="btn btn-sm" id="clear-empty" type="button">Clear filters</button>');

                const clearEmpty = el('clear-empty');

                if (clearEmpty)
                {
                    clearEmpty.addEventListener('click', clearFilters);
                }
            }
            else
            {
                const rankOf = {};

                applicants.forEach(function (item, index)
                {
                    rankOf[item.id] = index + 1;
                });

                list.innerHTML = '<div class="d-table-wrap"><table class="d-table"><thead><tr>' +
                    '<th><span class="d-sr">Select for comparison</span></th>' +
                    '<th>Rank</th><th>Applicant</th><th>Score</th><th>Status</th><th>Applied</th><th>Actions</th>' +
                    '</tr></thead><tbody>' +
                    rows.map(function (item, index)
                    {
                        return rowHtml(item, rankOf[item.id], index);
                    }).join('') +
                    '</tbody></table></div>';
            }

            updateSelectionUI();
            Dash.icons();
        }

        function clearFilters()
        {
            el('filter-score').value = '';
            el('filter-skill').value = '';
            el('filter-status').value = '';
            render();
        }

        async function saveOverride(id, button)
        {
            const scoreInput = el('ov-score-' + id);
            const reasonInput = el('ov-reason-' + id);
            const errorBox = document.querySelector('[data-ov-error]');

            if (!scoreInput || !reasonInput || !errorBox)
            {
                return;
            }

            errorBox.classList.add('hidden');

            const score = Number(scoreInput.value);
            const reason = reasonInput.value.trim();

            if (scoreInput.value === '' || !Number.isFinite(score) || score < 0 || score > 100)
            {
                errorBox.textContent = 'Please enter a score between 0 and 100.';
                errorBox.classList.remove('hidden');
                return;
            }

            if (reason.length < 10)
            {
                errorBox.textContent = 'Please give a reason of at least 10 characters. Overrides are audited, so the reason is required.';
                errorBox.classList.remove('hidden');
                return;
            }

            Dash.setBusy(button, true);

            try
            {
                const updated = await Api.patch('/api/applications/' + id + '/override', { score: score, reason: reason });

                applicants = applicants.map(function (item)
                {
                    return item.id === updated.id ? updated : item;
                });

                applicants.sort(function (a, b)
                {
                    return (b.effectiveScore || 0) - (a.effectiveScore || 0);
                });

                openOverrideId = null;
                render();
                renderStats();
                showToast('Score overridden to ' + updated.effectiveScore + '. Your reason was recorded.', 'success');
            }
            catch (error)
            {
                errorBox.textContent = error.message;
                errorBox.classList.remove('hidden');
                Dash.setBusy(button, false);
            }
        }

        async function load()
        {
            if (!jobId)
            {
                el('job-sub').textContent = 'No job was selected.';
                fatalList('No job was selected. Open a job from the Jobs page to see its ranked applicants.', false);
                return;
            }

            el('toolbar').classList.remove('hidden');
            el('summary').textContent = '';
            el('list').innerHTML = Dash.skeletons(3);
            Board.showSkeleton();

            try
            {
                const results = await Promise.all([
                    Api.get('/api/jobs/' + jobId),
                    Api.get('/api/jobs/' + jobId + '/applicants')
                ]);

                job = results[0];
                applicants = results[1];
                renderJobHead();
                populateFilters();
                renderStats();
                render();
            }
            catch (error)
            {
                if (error.status === 404)
                {
                    el('job-sub').textContent = 'This job could not be found.';
                    fatalList(error.message + ' It may have been removed. Pick another job to review its applicants.', false);
                }
                else
                {
                    el('job-sub').textContent = 'Could not load this job.';
                    fatalList(error.message, true);
                }
            }
        }

        if (user)
        {
            Board.init(
            {
                jobId: jobId,
                onMoved: function (updated)
                {
                    applicants = applicants.map(function (item)
                    {
                        return String(item.id) === String(updated.id) ? updated : item;
                    });

                    render();
                    renderStats();
                }
            });

            el('list').addEventListener('click', function (event)
            {
                const overrideButton = event.target.closest('[data-override]');

                if (overrideButton)
                {
                    const id = Number(overrideButton.getAttribute('data-override'));
                    openOverrideId = openOverrideId === id ? null : id;
                    render();
                    return;
                }

                const saveButton = event.target.closest('[data-ov-save]');

                if (saveButton)
                {
                    saveOverride(Number(saveButton.getAttribute('data-ov-save')), saveButton);
                    return;
                }

                if (event.target.closest('[data-ov-cancel]'))
                {
                    openOverrideId = null;
                    render();
                }
            });

            el('list').addEventListener('change', function (event)
            {
                const box = event.target.closest('[data-select]');

                if (!box)
                {
                    return;
                }

                const id = Number(box.getAttribute('data-select'));

                if (box.checked)
                {
                    if (selected.size >= 3)
                    {
                        box.checked = false;
                        showToast('You can compare 2 or 3 applicants at a time.', 'info');
                        return;
                    }

                    selected.add(id);
                }
                else
                {
                    selected.delete(id);
                }

                updateSelectionUI();
            });

            el('compare-btn').addEventListener('click', function ()
            {
                if (selected.size < 2)
                {
                    return;
                }

                window.location.href = 'compare.html?ids=' + Array.from(selected).join(',');
            });

            el('filter-score').addEventListener('input', render);
            el('filter-skill').addEventListener('change', render);
            el('filter-status').addEventListener('change', render);
            el('clear-filters').addEventListener('click', clearFilters);

            Dash.mountShell(
            {
                user: user,
                logo: 'sparkles',
                title: 'Applicants',
                subtitle: 'Ranked candidates for this job',
                search: true,
                items: Dash.RECRUITER_NAV,
                active: 'jobs.html',
                onBell: function ()
                {
                    showToast('You have no new notifications.', 'info');
                }
            });

            load();
        }
    </script>
</body>
</html>
