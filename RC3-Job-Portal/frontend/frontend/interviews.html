<body class="theme-recruiter">
    <script src="js/brand.js"></script>
    <script>showPageLoader(); window.addEventListener('load', hidePageLoader);</script>
    <div id="content" class="d-content">
        <section id="hero" aria-label="Next interview"></section>

        <div class="iv-note">
            <i data-lucide="bot"></i>
            <div><b>Humans decide, AI informs</b>AI assessment scores help you prepare for each interview, but every reschedule, every piece of feedback and every final decision on this page is made by you.</div>
        </div>

        <section class="iv-kpis" id="kpis" aria-label="Interview numbers"></section>

        <div class="iv-week" id="week" role="group" aria-label="Next seven days"></div>

        <div class="iv-tools" id="tools">
            <div class="iv-tabs" id="tabs" role="group" aria-label="Interview status">
                <button type="button" class="iv-tab" data-tab="all" aria-pressed="true">All <em>0</em></button>
                <button type="button" class="iv-tab" data-tab="upcoming" aria-pressed="false">Upcoming <em>0</em></button>
                <button type="button" class="iv-tab" data-tab="awaiting" aria-pressed="false">Needs feedback <em>0</em></button>
                <button type="button" class="iv-tab" data-tab="completed" aria-pressed="false">Completed <em>0</em></button>
            </div>
            <div class="d-field grow">
                <label for="iv-search">Search interviews</label>
                <input type="search" id="iv-search" placeholder="Candidate, job or interviewer" autocomplete="off">
            </div>
            <div class="d-field">
                <label for="iv-type">Type</label>
                <select id="iv-type">
                    <option value="">Any type</option>
                    <option value="technical">Technical</option>
                    <option value="behavioural">Behavioural</option>

        <div class="d-group-title" id="upcoming-title">Upcoming</div>

    <dialog class="pg-dialog" id="decision-dialog" aria-labelledby="dec-title">

    <script>
        const user = guardPage('recruiter');

        const TYPE_LABELS =
        {
            technical: 'Technical',
            behavioural: 'Behavioural',
            culture: 'Culture fit',
            hr: 'HR round'
        };

        const RECOMMENDATION_TONE =
        {
            hire: 'ok',
            hold: 'warn',
            reject: 'bad'
        };

        const CRITERIA = ['technical', 'communication', 'problem_solving', 'culture_fit'];

        const state =
        {
            interviews: [],
            openReschedule: null,
            openFeedback: null,
            decisionNote: null,
            focus: null,
            tab: 'all',
            query: '',
            type: '',
            day: null,
            countedUp: false
        };

        let pendingDecision = null;
        let decisionOpener = null;
        let cardIndex = 0;

        function el(id)
        {
            return document.getElementById(id);
        }

        function findInterview(id)
        {
            for (let i = 0; i < state.interviews.length; i++)
            {
                if (state.interviews[i].id === id)
                {
                    return state.interviews[i];
                }
            }

            return null;
        }

        function isUpcoming(interview)
        {
            return interview.status === 'scheduled' && new Date(interview.scheduled_at).getTime() > Date.now();
        }

        function awaitingFeedback(interview)
        {
            return !interview.feedback && !isUpcoming(interview);
        }

        function typeLabel(type)
        {
            const key = String(type || 'technical');
            return TYPE_LABELS[key] || key.charAt(0).toUpperCase() + key.slice(1);
        }

        function recommendationLabel(value)
        {
            return String(value || '').charAt(0).toUpperCase() + String(value || '').slice(1);
        }

        function pad(value)
        {
            return value < 10 ? '0' + value : String(value);
        }

        function toDateInput(iso)
        {
            const date = new Date(iso);
            return isNaN(date.getTime()) ? '' : date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate());
        }

        function toTimeInput(iso)
        {
            const date = new Date(iso);
            return isNaN(date.getTime()) ? '' : pad(date.getHours()) + ':' + pad(date.getMinutes());
        }

        function clock(date)
        {
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function timeRange(iso, minutes)
        {
            const start = new Date(iso);
            const end = new Date(start.getTime() + (Number(minutes) || 0) * 60000);
            return clock(start) + ' to ' + clock(end);
        }

        function startOfDay(date)
        {
            return new Date(date.getFullYear(), date.getMonth(), date.getDate());
        }

        function dayLabel(iso)
        {
            const date = new Date(iso);
            const diff = Math.round((startOfDay(date) - startOfDay(new Date())) / 86400000);

            if (diff === 0)
            {
                return 'Today';
            }

            if (diff === 1)
            {
                return 'Tomorrow';
            }

            if (diff === -1)
            {
                return 'Yesterday';
            }

            return date.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
        }

        // turns the gap to the interview into something quick to read, like "in 2d 4h"
        function countdownText(iso)
        {
            const ms = new Date(iso).getTime() - Date.now();

            if (ms <= 0)
            {
                return 'Starting now';
            }

            const minutes = Math.floor(ms / 60000);
            const hours = Math.floor(minutes / 60);
            const days = Math.floor(hours / 24);

            if (days >= 1)
            {
                return 'in ' + days + 'd ' + (hours % 24) + 'h';
            }

            if (hours >= 1)
            {
                return 'in ' + hours + 'h ' + (minutes % 60) + 'm';
            }

            return 'in ' + Math.max(minutes, 1) + ' min';
        }

        function isNear(iso)
        {
            const ms = new Date(iso).getTime() - Date.now();
            return ms > 0 && ms < 3600000;
        }

        function overlaps(startA, minutesA, startB, minutesB)
        {
            const a1 = new Date(startA).getTime();
            const a2 = a1 + (Number(minutesA) || 0) * 60000;
            const b1 = new Date(startB).getTime();
            const b2 = b1 + (Number(minutesB) || 0) * 60000;
            return a1 < b2 && b1 < a2;
        }

        function localConflicts(interview, payload)
        {
            const conflicts = [];

            state.interviews.forEach(function (existing)
            {
                if (existing.status === 'cancelled' || existing.id === interview.id)
                {
                    return;
                }

                if (!overlaps(payload.scheduled_at, payload.duration_minutes, existing.scheduled_at, existing.duration_minutes))
                {
                    return;
                }

                if (existing.interviewer === payload.interviewer)
                {
                    conflicts.push({ name: existing.interviewer, scheduled_at: existing.scheduled_at, duration_minutes: existing.duration_minutes, with: existing.candidateName });
                }

                if (existing.applicationId === interview.applicationId)
                {
                    conflicts.push({ name: existing.candidateName, scheduled_at: existing.scheduled_at, duration_minutes: existing.duration_minutes, with: existing.interviewer });
                }
            });

            return conflicts;
        }

        function conflictListHtml(conflicts)
        {
            if (!conflicts.length)
            {
                return '<p>Another interview overlaps this slot.</p>';
            }

            return '<ul class="pg-conflict-list">' + conflicts.map(function (conflict)
            {
                return '<li><strong>' + Dash.esc(conflict.name) + '</strong> already has an interview from ' +
                    Dash.esc(timeRange(conflict.scheduled_at, conflict.duration_minutes)) + ' with ' + Dash.esc(conflict.with) + '.</li>';
            }).join('') + '</ul>';
        }

        /* ---------- hero, stats and week strip ---------- */

        function nextInterview()
        {
            return state.interviews.filter(isUpcoming).sort(byTime(1))[0] || null;
        }

        function renderHero()
        {
            const next = nextInterview();

            if (!next)
            {
                el('hero').innerHTML = '<div class="iv-hero"><div><h2>Nothing on the calendar</h2><p>No interviews are scheduled right now. Pick a strong applicant and book a slot.</p>' +
                    '<div class="iv-hero-actions"><a class="btn btn-accent" href="jobs.html"><i data-lucide="briefcase"></i>Go to jobs and applicants</a></div></div></div>';
                return;
            }

            const todayCount = state.interviews.filter(function (item)
            {
                return isUpcoming(item) && toDateInput(item.scheduled_at) === toDateInput(new Date());
            }).length;

            el('hero').innerHTML = '<div class="iv-hero">' +
                '<div>' +
                    '<div class="iv-eyebrow">' + Dash.esc(dayLabel(next.scheduled_at)) + (todayCount > 1 ? ' &middot; ' + todayCount + ' interviews today' : '') + '</div>' +
                    '<h2>Next up: ' + Dash.esc(next.candidateName) + '</h2>' +
                    '<p>' + Dash.esc(next.jobTitle) + ' &middot; ' + Dash.esc(timeRange(next.scheduled_at, next.duration_minutes)) + ' with ' + Dash.esc(next.interviewer) + '</p>' +
                    '<div class="iv-hero-actions">' +
                        '<a class="btn btn-accent btn-sm" href="applicant-detail.html?id=' + encodeURIComponent(next.applicationId) + '"><i data-lucide="user"></i>Review applicant</a>' +
                        '<button class="btn btn-secondary btn-sm" type="button" data-hero-reschedule="' + next.id + '"><i data-lucide="calendar-clock"></i>Reschedule</button>' +
                    '</div>' +
                '</div>' +
                '<div class="iv-count' + (isNear(next.scheduled_at) ? ' is-soon' : '') + '"><b data-countdown="' + Dash.esc(next.scheduled_at) + '">' + Dash.esc(countdownText(next.scheduled_at)) + '</b><span>until it starts</span></div>' +
            '</div>';
        }

        function kpiCard(icon, value, label, tone, index)
        {
            return '<div class="iv-kpi' + (tone ? ' ' + tone : '') + '" style="--i:' + index + '"><div class="ic"><i data-lucide="' + icon + '"></i></div>' +
                '<div><b data-count="' + Dash.esc(value) + '">' + (state.countedUp ? Dash.esc(value) : '0') + '</b><span>' + label + '</span></div></div>';
        }

        function renderKpis()
        {
            const upcoming = state.interviews.filter(isUpcoming).length;
            const completed = state.interviews.filter(function (interview) { return interview.status === 'completed'; }).length;
            const awaiting = state.interviews.filter(awaitingFeedback).length;
            const week = weekDays().reduce(function (sum, day) { return sum + day.count; }, 0);

            el('kpis').innerHTML =
                kpiCard('calendar-clock', upcoming, 'Upcoming interviews', '', 0) +
                kpiCard('calendar-days', week, 'In the next 7 days', '', 1) +
                kpiCard('message-square', awaiting, 'Awaiting feedback', awaiting ? 'is-warn' : '', 2) +
                kpiCard('check-circle-2', completed, 'Completed', 'is-ok', 3);

            if (!state.countedUp)
            {
                el('kpis').querySelectorAll('[data-count]').forEach(function (node)
                {
                    Polish.countUp(node, node.getAttribute('data-count'));
                });

                state.countedUp = true;
            }
        }

        function weekDays()
        {
            const days = [];

            for (let i = 0; i < 7; i++)
            {
                const date = new Date();
                date.setDate(date.getDate() + i);

                const key = toDateInput(date);
                const count = state.interviews.filter(function (item)
                {
                    return item.status !== 'cancelled' && toDateInput(item.scheduled_at) === key;
                }).length;

                days.push({ key: key, date: date, count: count, today: i === 0 });
            }

            return days;
        }

        function renderWeek()
        {
            el('week').innerHTML = weekDays().map(function (day)
            {
                const dots = Array.from({ length: Math.min(day.count, 3) }).map(function () { return '<em></em>'; }).join('');
                const label = day.date.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' }) + ', ' + day.count + (day.count === 1 ? ' interview' : ' interviews');

                return '<button type="button" class="iv-day' + (day.today ? ' is-today' : '') + '" data-day="' + day.key + '" aria-pressed="' + (state.day === day.key ? 'true' : 'false') + '" aria-label="' + Dash.esc(label) + '">' +
                    '<small>' + Dash.esc(day.today ? 'Today' : day.date.toLocaleDateString(undefined, { weekday: 'short' })) + '</small>' +
                    '<b>' + day.date.getDate() + '</b><i>' + dots + '</i></button>';
            }).join('');
        }

        function renderTabs()
        {
            const counts =
            {
                all: state.interviews.length,
                upcoming: state.interviews.filter(isUpcoming).length,
                awaiting: state.interviews.filter(awaitingFeedback).length,
                completed: state.interviews.filter(function (item) { return item.status === 'completed'; }).length
            };

            el('tabs').querySelectorAll('[data-tab]').forEach(function (button)
            {
                const key = button.getAttribute('data-tab');
                button.setAttribute('aria-pressed', String(key === state.tab));
                button.querySelector('em').textContent = counts[key];
            });
        }

        function filtered()
        {
            const term = state.query.trim().toLowerCase();

            return state.interviews.filter(function (item)
            {
                if (state.tab === 'upcoming' && !isUpcoming(item))
                {
                    return false;
                }

                if (state.tab === 'awaiting' && !awaitingFeedback(item))
                {
                    return false;
                }

                if (state.tab === 'completed' && item.status !== 'completed')
                {
                    return false;
                }

                if (state.type && (item.interview_type || 'technical') !== state.type)
                {
                    return false;
                }

                if (state.day && toDateInput(item.scheduled_at) !== state.day)
                {
                    return false;
                }

                if (term && [item.candidateName, item.jobTitle, item.interviewer].join(' ').toLowerCase().indexOf(term) === -1)
                {
                    return false;
                }

                return true;
            });
        }

        function filtersActive()
        {
            return state.tab !== 'all' || state.query.trim() !== '' || state.type !== '' || state.day !== null;
        }

        function resetFilters()
        {
            state.tab = 'all';
            state.query = '';
            state.type = '';
            state.day = null;
            el('iv-search').value = '';
            el('iv-type').value = '';
        }

        /* ---------- radio groups and forms (logic unchanged) ---------- */

        function wireRadioGroup(group, onChange)
        {
            const buttons = Array.from(group.querySelectorAll('[role="radio"]'));

            if (!buttons.length)
            {
                return;
            }

            function choose(button, moveFocus)
            {
                buttons.forEach(function (other)
                {
                    const on = other === button;
                    other.setAttribute('aria-checked', on ? 'true' : 'false');
                    other.tabIndex = on ? 0 : -1;
                });

                if (moveFocus)
                {
                    button.focus();
                }

                onChange(button);
            }

            const checked = buttons.filter(function (button)
            {
                return button.getAttribute('aria-checked') === 'true';
            })[0];

            buttons.forEach(function (button)
            {
                button.tabIndex = (checked ? button === checked : button === buttons[0]) ? 0 : -1;

                button.addEventListener('click', function ()
                {
                    choose(button, false);
                });

                button.addEventListener('keydown', function (event)
                {
                    const at = buttons.indexOf(button);
                    let next = -1;

                    if (event.key === 'ArrowRight' || event.key === 'ArrowDown')
                    {
                        next = (at + 1) % buttons.length;
                    }
                    else if (event.key === 'ArrowLeft' || event.key === 'ArrowUp')
                    {
                        next = (at - 1 + buttons.length) % buttons.length;
                    }
                    else if (event.key === 'Home')
                    {
                        next = 0;
                    }
                    else if (event.key === 'End')
                    {
                        next = buttons.length - 1;
                    }

                    if (next === -1)
                    {
                        return;
                    }

                    event.preventDefault();
                    choose(buttons[next], true);
                });
            });
        }

        function typeSegmentHtml(interview)
        {
            const current = interview.interview_type || 'technical';

            return '<div class="pg-seg" role="radiogroup" aria-labelledby="rs-type-label-' + interview.id + '" data-type-group data-value="' + Dash.esc(current) + '">' +
                Object.keys(TYPE_LABELS).map(function (type)
                {
                    return '<button type="button" role="radio" aria-checked="' + (type === current ? 'true' : 'false') + '" data-value="' + type + '">' + TYPE_LABELS[type] + '</button>';
                }).join('') + '</div>';
        }

        function rescheduleFormHtml(interview)
        {
            return '<div class="d-compare-col pg-open" style="margin-top:16px">' +
                '<form data-reschedule-form novalidate>' +
                    '<div class="d-form-grid">' +
                        '<div class="d-field">' +
                            '<label for="rs-date-' + interview.id + '">Date</label>' +
                            '<input type="date" id="rs-date-' + interview.id + '" data-date value="' + Dash.esc(toDateInput(interview.scheduled_at)) + '">' +
                            '<div class="error-text" data-error="date"></div>' +
                        '</div>' +
                        '<div class="d-field">' +
                            '<label for="rs-time-' + interview.id + '">Start time</label>' +
                            '<input type="time" id="rs-time-' + interview.id + '" data-time value="' + Dash.esc(toTimeInput(interview.scheduled_at)) + '">' +
                            '<div class="error-text" data-error="time"></div>' +
                        '</div>' +
                        '<div class="d-field">' +
                            '<label for="rs-duration-' + interview.id + '">Duration in minutes</label>' +
                            '<input type="number" id="rs-duration-' + interview.id + '" data-duration min="15" max="240" step="5" value="' + Dash.esc(interview.duration_minutes) + '">' +
                            '<div class="error-text" data-error="duration"></div>' +
                        '</div>' +
                        '<div class="d-field">' +
                            '<label for="rs-interviewer-' + interview.id + '">Interviewer</label>' +
                            '<input type="text" id="rs-interviewer-' + interview.id + '" data-interviewer value="' + Dash.esc(interview.interviewer) + '">' +
                            '<div class="error-text" data-error="interviewer"></div>' +
                        '</div>' +
                        '<div class="d-field full">' +
                            '<span id="rs-type-label-' + interview.id + '" class="label">Interview type</span>' +
                            typeSegmentHtml(interview) +
                        '</div>' +
                    '</div>' +
                    '<div data-conflicts aria-live="polite"></div>' +
                    '<div class="error-text" data-form-error role="alert"></div>' +
                    '<div class="d-actions">' +
                        '<button class="btn btn-sm" type="submit" data-submit-reschedule><i data-lucide="save"></i>Save new time</button>' +
                        '<button class="btn btn-secondary btn-sm" type="button" data-open="reschedule">Cancel</button>' +
                    '</div>' +
                '</form>' +
            '</div>';
        }

        function ratingFieldHtml(interview, key, label, value)
        {
            const buttons = [1, 2, 3, 4, 5].map(function (level)
            {
                return '<button type="button" role="radio" aria-label="' + level + ' out of 5" aria-checked="' + (level === value ? 'true' : 'false') + '" data-value="' + level + '"' +
                    (value && level <= value ? ' class="on"' : '') + '>' + level + '</button>';
            }).join('');

            return '<div class="d-field" data-rating="' + key + '" data-label="' + Dash.esc(label) + '"' + (value ? ' data-value="' + value + '"' : '') + '>' +
                '<label id="fb-' + key + '-' + interview.id + '">' + Dash.esc(label) + '</label>' +
                '<div class="d-rating pg-rating" role="radiogroup" aria-labelledby="fb-' + key + '-' + interview.id + '">' + buttons + '</div>' +
                '<p class="d-sr" aria-live="polite" data-live>' + Dash.esc(label + ': ' + (value ? value + ' out of 5' : 'not rated yet')) + '</p>' +
                '<div class="error-text" data-error></div>' +
            '</div>';
        }

        function feedbackFormHtml(interview)
        {
            const feedback = interview.feedback;
            const recommendation = feedback ? feedback.recommendation : '';
            const comments = feedback ? feedback.comments : '';
            const ratingValue = function (key)
            {
                return feedback ? feedback[key] : 0;
            };

            return '<div class="d-compare-col pg-open" style="margin-top:16px">' +
                '<form data-feedback-form novalidate>' +
                    '<h3>' + (feedback ? 'Edit feedback' : 'Interview feedback') + '</h3>' +
                    '<p class="sub">Rate each area from 1 (poor) to 5 (excellent). Use the arrow keys to change a rating.</p>' +
                    '<div class="d-form-grid">' +
                        ratingFieldHtml(interview, 'technical', 'Technical', ratingValue('technical')) +
                        ratingFieldHtml(interview, 'communication', 'Communication', ratingValue('communication')) +
                        ratingFieldHtml(interview, 'problem_solving', 'Problem solving', ratingValue('problem_solving')) +
                        ratingFieldHtml(interview, 'culture_fit', 'Culture fit', ratingValue('culture_fit')) +
                        '<div class="d-field full">' +
                            '<label for="fb-comments-' + interview.id + '">Comments</label>' +
                            '<textarea id="fb-comments-' + interview.id + '" data-comments placeholder="What stood out? Any concerns worth recording?">' + Dash.esc(comments) + '</textarea>' +
                        '</div>' +
                        '<div class="d-field full">' +
                            '<label for="fb-recommendation-' + interview.id + '">Recommendation</label>' +
                            '<select id="fb-recommendation-' + interview.id + '" data-recommendation>' +
                                '<option value="">Choose one</option>' +
                                '<option value="hire"' + (recommendation === 'hire' ? ' selected' : '') + '>Hire</option>' +
                                '<option value="hold"' + (recommendation === 'hold' ? ' selected' : '') + '>Hold</option>' +
                                '<option value="reject"' + (recommendation === 'reject' ? ' selected' : '') + '>Reject</option>' +
                            '</select>' +
                            '<div class="error-text" data-error="recommendation"></div>' +
                        '</div>' +
                    '</div>' +
                    '<div class="error-text" data-form-error role="alert"></div>' +
                    '<div class="d-actions">' +
                        '<button class="btn btn-sm" type="submit" data-submit-feedback><i data-lucide="send"></i>Save feedback</button>' +
                        (awaitingFeedback(interview) ? '' : '<button class="btn btn-secondary btn-sm" type="button" data-open="feedback">Cancel</button>') +
                    '</div>' +
                '</form>' +
            '</div>';
        }

        function scoreRow(label, value)
        {
            const number = Number(value) || 0;

            return '<div class="iv-score"><span>' + Dash.esc(label) + '</span><div class="bar"><i style="--w:' + (number / 5 * 100) + '%"></i></div><b>' + Dash.esc(value) + '</b></div>';
        }

        function feedbackViewHtml(interview)
        {
            const feedback = interview.feedback;

            return '<div class="d-compare-col" style="margin-top:16px">' +
                '<div class="d-panel-head">' +
                    '<div><h3>Interview feedback</h3><p class="sub">Submitted by ' + Dash.esc(feedback.submittedBy) + ' &middot; ' + Dash.esc(Dash.timeAgo(feedback.submittedAt)) + '</p></div>' +
                    Dash.badge(recommendationLabel(feedback.recommendation), RECOMMENDATION_TONE[feedback.recommendation] || 'neutral') +
                '</div>' +
                '<div class="iv-scores">' +
                    scoreRow('Technical', feedback.technical) +
                    scoreRow('Communication', feedback.communication) +
                    scoreRow('Problem solving', feedback.problem_solving) +
                    scoreRow('Culture fit', feedback.culture_fit) +
                '</div>' +
                (feedback.comments ? '<div class="d-excerpt" style="margin-top:16px">' + Dash.esc(feedback.comments) + '</div>' : '') +
            '</div>';
        }

        function decisionRegionHtml(interview)
        {
            return '<div class="d-compare-col" style="margin-top:16px">' +
                '<h3>Final decision</h3>' +
                '<p class="sub">Record the outcome for ' + Dash.esc(interview.candidateName) + '. The candidate is notified as soon as you confirm.</p>' +
                '<div class="d-actions">' +
                    '<button class="btn btn-success btn-sm" type="button" data-start-decision="Selected"><i data-lucide="user-check"></i>Select candidate</button>' +
                    '<button class="btn btn-danger btn-sm" type="button" data-start-decision="Rejected"><i data-lucide="user-x"></i>Reject candidate</button>' +
                '</div>' +
            '</div>';
        }

        function feedbackToggleHtml(interview)
        {
            if (awaitingFeedback(interview))
            {
                return '';
            }

            if (state.openFeedback === interview.id)
            {
                return '<button class="btn btn-secondary btn-sm" type="button" data-open="feedback">Close feedback</button>';
            }

            return '<button class="btn btn-secondary btn-sm" type="button" data-open="feedback"><i data-lucide="message-square"></i>' +
                (interview.feedback ? 'Edit feedback' : 'Add feedback') + '</button>';
        }

        /* ---------- the interview card ---------- */

        function cardHtml(interview)
        {
            const upcoming = isUpcoming(interview);
            const date = new Date(interview.scheduled_at);
            const type = interview.interview_type || 'technical';
            const statusBadge = interview.status === 'completed'
                ? Dash.badge('Completed', 'ok')
                : Dash.badge('Scheduled', 'info');
            const lateBadge = interview.status === 'scheduled' && !upcoming ? Dash.badge('Time passed', 'warn') : '';
            const kept = (interview.conflicts || []).length;

            let html = '<section class="d-panel iv-card iv-type-' + Dash.esc(type) + '" data-interview="' + interview.id + '" style="--i:' + (cardIndex++) + '">' +
                '<div class="iv-row">' +
                    '<div class="iv-date" aria-hidden="true"><b>' + date.getDate() + '</b><span>' + Dash.esc(date.toLocaleDateString(undefined, { month: 'short' })) + '</span></div>' +
                    '<div class="iv-main">' +
                        '<div class="iv-who">' +
                            '<span class="jp-avatar" aria-hidden="true">' + Dash.esc(Polish.initials(interview.candidateName)) + '</span>' +
                            '<div><h3 class="pg-iv-title" tabindex="-1">' + Dash.esc(interview.candidateName) + '</h3>' +
                            '<p class="iv-sub">' + Dash.esc(interview.jobTitle) + ' &middot; Interviewer ' + Dash.esc(interview.interviewer) + '</p></div>' +
                        '</div>' +
                        '<div class="iv-chips">' +
                            '<span class="iv-when"><i data-lucide="clock"></i>' + Dash.esc(timeRange(interview.scheduled_at, interview.duration_minutes)) + '</span>' +
                            '<span class="iv-when">' + Dash.esc(interview.duration_minutes) + ' min</span>' +
                            Dash.badge(typeLabel(type), 'neutral') + statusBadge + lateBadge +
                            (upcoming ? '<span class="iv-soon' + (isNear(interview.scheduled_at) ? ' is-near' : '') + '" data-countdown="' + Dash.esc(interview.scheduled_at) + '">' + Dash.esc(countdownText(interview.scheduled_at)) + '</span>' : '') +
                            (awaitingFeedback(interview) ? '<span class="iv-need">Feedback needed</span>' : '') +
                        '</div>' +
                    '</div>' +
                '</div>';

            if (kept)
            {
                html += Dash.callout('triangle-alert', 'This interview intentionally overlaps ' + kept + (kept === 1 ? ' other interview' : ' other interviews'),
                    conflictListHtml(interview.conflicts), 'warn');
            }

            if (state.decisionNote && state.decisionNote.interviewId === interview.id)
            {
                html += Dash.callout('check-circle-2', 'Decision recorded. The candidate was notified:',
                    '<p>' + Dash.esc(state.decisionNote.message) + '</p>', 'ok');
            }

            html += '<div class="d-actions">' +
                    '<button class="btn btn-secondary btn-sm" type="button" data-open="reschedule"><i data-lucide="calendar-clock"></i>' +
                        (state.openReschedule === interview.id ? 'Close reschedule' : 'Reschedule') + '</button>' +
                    feedbackToggleHtml(interview) +
                    '<a class="btn btn-secondary btn-sm" href="applicant-detail.html?id=' + encodeURIComponent(interview.applicationId) + '"><i data-lucide="user"></i>View applicant</a>' +
                '</div>';

            if (state.openReschedule === interview.id)
            {
                html += rescheduleFormHtml(interview);
            }

            if (state.openFeedback === interview.id || awaitingFeedback(interview))
            {
                html += feedbackFormHtml(interview);
            }
            else if (interview.feedback)
            {
                html += feedbackViewHtml(interview);
            }

            if (interview.feedback)
            {
                html += decisionRegionHtml(interview);
            }

            return html + '</section>';
        }

        function dayGroups(list)
        {
            const groups = [];
            const byKey = {};

            list.forEach(function (interview)
            {
                const key = toDateInput(interview.scheduled_at);

                if (!byKey[key])
                {
                    byKey[key] = { label: dayLabel(interview.scheduled_at), items: [] };
                    groups.push(byKey[key]);
                }

                byKey[key].items.push(interview);
            });

            return groups;
        }

        function groupedHtml(list)
        {
            return dayGroups(list).map(function (group)
            {
                return '<div class="pg-day"><h2 class="pg-day-title">' + Dash.esc(group.label) +
                    '<span>' + group.items.length + (group.items.length === 1 ? ' interview' : ' interviews') + '</span></h2>' +
                    group.items.map(cardHtml).join('') + '</div>';
            }).join('');
        }

        function byTime(direction)
        {
            return function (a, b)
            {
                return direction * (new Date(a.scheduled_at).getTime() - new Date(b.scheduled_at).getTime());
            };
        }

        function emptyHtml(icon, text, action)
        {
            return '<div class="iv-empty"><div class="orb"><i data-lucide="' + icon + '"></i></div><p>' + text + '</p>' + (action || '') + '</div>';
        }

        function render()
        {
            cardIndex = 0;

            renderHero();
            renderKpis();
            renderWeek();
            renderTabs();

            const list = filtered();
            const upcoming = list.filter(isUpcoming).sort(byTime(1));
            const past = list.filter(function (interview) { return !isUpcoming(interview); }).sort(byTime(-1));

            el('iv-clear').hidden = !filtersActive();
            el('upcoming-title').classList.toggle('hidden', !upcoming.length);
            el('past-title').classList.toggle('hidden', !past.length);

            if (!state.interviews.length)
            {
                el('upcoming-title').classList.add('hidden');
                el('upcoming').innerHTML = emptyHtml('calendar-clock', 'No interviews yet. Schedule one from an applicant page.', '<a class="btn btn-sm" href="jobs.html">Go to jobs and applicants</a>');
            }
            else if (!list.length)
            {
                el('upcoming-title').classList.add('hidden');
                el('upcoming').innerHTML = emptyHtml('filter', 'No interviews match these filters.', '<button class="btn btn-sm" type="button" id="iv-clear-empty">Clear filters</button>');
            }
            else
            {
                el('upcoming').innerHTML = upcoming.length ? groupedHtml(upcoming) : '';
            }

            el('past').innerHTML = groupedHtml(past);

            wire();
            Dash.icons();

            if (state.focus)
            {
                const target = document.querySelector(state.focus);

                if (target)
                {
                    target.focus();
                }

                state.focus = null;
            }
        }

        function wire()
        {
            document.querySelectorAll('[data-interview]').forEach(function (card)
            {
                const id = card.getAttribute('data-interview');
                const interview = findInterview(Number.isNaN(Number(id)) ? id : Number(id));

                if (!interview)
                {
                    return;
                }

                card.querySelectorAll('[data-open]').forEach(function (button)
                {
                    button.addEventListener('click', function ()
                    {
                        const what = button.getAttribute('data-open');
                        const base = '[data-interview="' + id + '"] ';

                        if (what === 'reschedule')
                        {
                            const opening = state.openReschedule !== interview.id;
                            state.openReschedule = opening ? interview.id : null;
                            state.focus = base + (opening ? '[data-date]' : '[data-open="reschedule"]');
                        }
                        else
                        {
                            const opening = state.openFeedback !== interview.id;
                            state.openFeedback = opening ? interview.id : null;
                            state.focus = base + (opening ? '[data-rating] [role="radio"]' : '[data-open="feedback"]');
                        }

                        render();
                    });
                });

                wireReschedule(card, interview);
                wireFeedback(card, interview);

                card.querySelectorAll('[data-start-decision]').forEach(function (button)
                {
                    button.addEventListener('click', function ()
                    {
                        openDecision(interview, button.getAttribute('data-start-decision'), button);
                    });
                });
            });

            const emptyClear = el('iv-clear-empty');

            if (emptyClear)
            {
                emptyClear.addEventListener('click', function ()
                {
                    resetFilters();
                    render();
                });
            }
        }

        function wireReschedule(card, interview)
        {
            const form = card.querySelector('[data-reschedule-form]');

            if (!form)
            {
                return;
            }

            const group = form.querySelector('[data-type-group]');

            wireRadioGroup(group, function (button)
            {
                group.setAttribute('data-value', button.getAttribute('data-value'));
            });

            form.addEventListener('keydown', function (event)
            {
                if (event.key === 'Escape')
                {
                    state.openReschedule = null;
                    state.focus = '[data-interview="' + card.getAttribute('data-interview') + '"] [data-open="reschedule"]';
                    render();
                }
            });

            form.addEventListener('submit', function (event)
            {
                event.preventDefault();

                const date = form.querySelector('[data-date]').value;
                const time = form.querySelector('[data-time]').value;
                const duration = Number(form.querySelector('[data-duration]').value);
                const interviewer = form.querySelector('[data-interviewer]').value.trim();
                const errors =
                {
                    date: form.querySelector('[data-error="date"]'),
                    time: form.querySelector('[data-error="time"]'),
                    duration: form.querySelector('[data-error="duration"]'),
                    interviewer: form.querySelector('[data-error="interviewer"]')
                };
                let valid = true;

                errors.date.textContent = date ? '' : 'Please pick a date for the interview.';
                errors.time.textContent = time ? '' : 'Please pick a start time.';
                errors.duration.textContent = '';
                errors.interviewer.textContent = '';

                if (!date || !time)
                {
                    valid = false;
                }

                const when = new Date(date + 'T' + time);

                if (date && time && isNaN(when.getTime()))
                {
                    errors.date.textContent = 'That date and time is not valid. Check both and try again.';
                    valid = false;
                }

                if (!Number.isFinite(duration) || duration < 15 || duration > 240)
                {
                    errors.duration.textContent = 'Interview length must be between 15 and 240 minutes.';
                    valid = false;
                }

                if (!interviewer)
                {
                    errors.interviewer.textContent = 'Please say who will run the interview.';
                    valid = false;
                }

                if (!valid)
                {
                    return;
                }

                const payload =
                {
                    scheduled_at: when.toISOString(),
                    duration_minutes: duration,
                    interviewer: interviewer,
                    interview_type: group.getAttribute('data-value')
                };

                submitReschedule(card, interview, payload, false, form.querySelector('[data-submit-reschedule]'));
            });
        }

        async function submitReschedule(card, interview, payload, force, button)
        {
            const conflictBox = card.querySelector('[data-conflicts]');
            const errorBox = card.querySelector('[data-reschedule-form] [data-form-error]');

            conflictBox.innerHTML = '';
            errorBox.textContent = '';
            Dash.setBusy(button, true);

            const body =
            {
                scheduled_at: payload.scheduled_at,
                duration_minutes: payload.duration_minutes,
                interviewer: payload.interviewer,
                interview_type: payload.interview_type
            };

            if (force)
            {
                body.force = true;
            }

            try
            {
                const result = await Api.put('/api/interviews/' + interview.id, body);
                const kept = (result.conflicts || []).length;

                showToast(kept
                    ? 'Interview rescheduled with ' + kept + ' intentional ' + (kept === 1 ? 'clash' : 'clashes') + '.'
                    : 'Interview rescheduled.', 'success');
                state.openReschedule = null;
                state.focus = '[data-interview="' + interview.id + '"] .pg-iv-title';
                await load();
            }
            catch (error)
            {
                Dash.setBusy(button, false);

                if (error.status === 409 && !force)
                {
                    const conflicts = localConflicts(interview, payload);

                    conflictBox.innerHTML = Dash.callout('triangle-alert', error.message,
                        conflictListHtml(conflicts) +
                        '<div class="pg-conflict-actions">' +
                            '<button class="btn btn-secondary btn-sm" type="button" data-pick-another>Pick another time</button>' +
                            '<button class="btn btn-danger btn-sm" type="button" data-force-reschedule>Schedule anyway</button>' +
                        '</div>',
                        'warn');
                    Dash.icons();

                    conflictBox.querySelector('[data-pick-another]').addEventListener('click', function ()
                    {
                        conflictBox.innerHTML = '';
                        card.querySelector('[data-time]').focus();
                    });

                    const forceButton = conflictBox.querySelector('[data-force-reschedule]');

                    forceButton.addEventListener('click', function ()
                    {
                        submitReschedule(card, interview, payload, true, forceButton);
                    });

                    forceButton.parentNode.querySelector('[data-pick-another]').focus();
                    return;
                }

                errorBox.textContent = error.message;
            }
        }

        function wireFeedback(card, interview)
        {
            card.querySelectorAll('[data-rating]').forEach(function (field)
            {
                const label = field.getAttribute('data-label');
                const group = field.querySelector('.d-rating');

                wireRadioGroup(group, function (button)
                {
                    const value = Number(button.getAttribute('data-value'));

                    field.setAttribute('data-value', String(value));
                    group.querySelectorAll('button').forEach(function (other)
                    {
                        other.classList.toggle('on', Number(other.getAttribute('data-value')) <= value);
                    });
                    field.querySelector('[data-live]').textContent = label + ': ' + value + ' out of 5';
                    field.querySelector('[data-error]').textContent = '';
                });
            });

            const form = card.querySelector('[data-feedback-form]');

            if (!form)
            {
                return;
            }

            form.addEventListener('submit', function (event)
            {
                event.preventDefault();
                submitFeedback(form, interview);
            });
        }

        async function submitFeedback(form, interview)
        {
            const body = {};
            let valid = true;

            form.querySelector('[data-form-error]').textContent = '';

            CRITERIA.forEach(function (key)
            {
                const field = form.querySelector('[data-rating="' + key + '"]');
                const error = field.querySelector('[data-error]');
                const value = Number(field.getAttribute('data-value'));

                if (!Number.isFinite(value) || value < 1 || value > 5)
                {
                    error.textContent = 'Please rate this from 1 to 5.';
                    valid = false;
                    return;
                }

                error.textContent = '';
                body[key] = value;
            });

            const recommendation = form.querySelector('[data-recommendation]').value;
            const recommendationError = form.querySelector('[data-error="recommendation"]');

            if (['hire', 'hold', 'reject'].indexOf(recommendation) === -1)
            {
                recommendationError.textContent = 'Please choose a recommendation: hire, hold or reject.';
                valid = false;
            }
            else
            {
                recommendationError.textContent = '';
            }

            if (!valid)
            {
                return;
            }

            body.comments = form.querySelector('[data-comments]').value.trim();
            body.recommendation = recommendation;

            const button = form.querySelector('[data-submit-feedback]');
            Dash.setBusy(button, true);

            try
            {
                await Api.post('/api/interviews/' + interview.id + '/feedback', body);
                showToast('Feedback saved for ' + interview.candidateName + '.', 'success');
                state.openFeedback = null;
                state.focus = '[data-interview="' + interview.id + '"] .pg-iv-title';
                await load();
            }
            catch (error)
            {
                Dash.setBusy(button, false);
                form.querySelector('[data-form-error]').textContent = error.message;
            }
        }

        function openDecision(interview, decision, opener)
        {
            const dialog = el('decision-dialog');
            const selecting = decision === 'Selected';
            const confirm = el('dec-confirm');

            pendingDecision = { interview: interview, decision: decision };
            decisionOpener = opener;

            el('dec-title').textContent = selecting ? 'Select this candidate' : 'Reject this candidate';
            el('dec-sub').textContent = 'The decision for ' + interview.candidateName + ' is audited and the candidate is notified.';
            el('dec-label').textContent = selecting ? 'Why are you selecting this candidate?' : 'Why are you rejecting this candidate?';
            el('dec-reason').value = '';
            el('dec-error').textContent = '';
            confirm.className = 'btn btn-sm ' + (selecting ? 'btn-success' : 'btn-danger');
            confirm.textContent = selecting ? 'Confirm selection' : 'Confirm rejection';
            Dash.setBusy(confirm, false);

            dialog.showModal();
            el('dec-reason').focus();
        }

        async function submitDecision()
        {
            const reasonInput = el('dec-reason');
            const errorBox = el('dec-error');
            const confirm = el('dec-confirm');
            const reason = reasonInput.value.trim();

            errorBox.textContent = '';

            if (!reason)
            {
                errorBox.textContent = 'Please give a reason for the final decision. The candidate is notified and the decision is audited.';
                reasonInput.focus();
                return;
            }

            const interview = pendingDecision.interview;

            Dash.setBusy(confirm, true);

            try
            {
                const result = await Api.post('/api/applications/' + interview.applicationId + '/decision',
                {
                    decision: pendingDecision.decision,
                    reason: reason
                });

                showToast('Decision recorded. Candidate notified.', 'success');
                state.decisionNote = { interviewId: interview.id, message: result.notification };
                state.focus = '[data-interview="' + interview.id + '"] .pg-iv-title';
                decisionOpener = null;
                el('decision-dialog').close();
                await load();
            }
            catch (error)
            {
                Dash.setBusy(confirm, false);
                errorBox.textContent = error.message;
            }
        }

        async function load()
        {
            const pastTitle = el('past-title');

            el('hero').innerHTML = '';
            el('kpis').innerHTML = Dash.skeletons(3);
            el('upcoming').innerHTML = Dash.skeletons(2);
            el('past').innerHTML = '';
            pastTitle.classList.add('hidden');

            try
            {
                state.interviews = await Api.get('/api/interviews');
                render();
            }
            catch (error)
            {
                el('kpis').innerHTML = '';
                el('past').innerHTML = '';
                pastTitle.classList.add('hidden');
                Dash.failInto(el('upcoming'), error.message, load);
            }
        }

        // keeps every countdown fresh without redrawing the page, so nothing you type is lost
        function tickCountdowns()
        {
            document.querySelectorAll('[data-countdown]').forEach(function (node)
            {
                node.textContent = countdownText(node.getAttribute('data-countdown'));
            });
        }

        if (user)
        {
            const dialog = el('decision-dialog');

            el('decision-form').addEventListener('submit', function (event)
            {
                event.preventDefault();
                submitDecision();
            });

            el('dec-cancel').addEventListener('click', function ()
            {
                dialog.close();
            });

            dialog.addEventListener('click', function (event)
            {
                if (event.target === dialog)
                {
                    dialog.close();
                }
            });

            dialog.addEventListener('close', function ()
            {
                if (decisionOpener && document.body.contains(decisionOpener))
                {
                    decisionOpener.focus();
                }

                decisionOpener = null;
            });

            el('tabs').addEventListener('click', function (event)
            {
                const button = event.target.closest('[data-tab]');

                if (!button)
                {
                    return;
                }

                state.tab = button.getAttribute('data-tab');
                render();
            });

            el('week').addEventListener('click', function (event)
            {
                const button = event.target.closest('[data-day]');

                if (!button)
                {
                    return;
                }

                // clicking the same day again clears the day filter
                state.day = state.day === button.getAttribute('data-day') ? null : button.getAttribute('data-day');
                render();
            });

            el('iv-search').addEventListener('input', function ()
            {
                state.query = this.value;
                render();
            });

            el('iv-type').addEventListener('change', function ()
            {
                state.type = this.value;
                render();
            });

            el('iv-clear').addEventListener('click', function ()
            {
                resetFilters();
                render();
            });

            el('hero').addEventListener('click', function (event)
            {
                const button = event.target.closest('[data-hero-reschedule]');

                if (!button)
                {
                    return;
                }

                const id = Number(button.getAttribute('data-hero-reschedule'));

                // make sure the card is visible before opening its form
                resetFilters();
                state.openReschedule = id;
                state.focus = '[data-interview="' + id + '"] [data-date]';
                render();
            });

            window.setInterval(tickCountdowns, 30000);

            Dash.mountShell(
            {
                user: user,
                logo: 'calendar-clock',
                title: 'Interviews',
                subtitle: 'Scheduled interviews, feedback and final decisions',
                search: true,
                items: Dash.RECRUITER_NAV,
                onBell: function ()
                {
                    showToast('You have no new notifications.', 'info');
                }
            });

            load();
        }
