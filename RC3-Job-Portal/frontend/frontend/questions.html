<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview questions – VEYRA</title>
    <meta name="theme-color" content="#FAF9F6" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#11132F" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#171A45">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <style>
        .q{border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px}
        .q p{margin-top:6px;max-width:75ch}
        .q .q-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
        .q .q-top .spacer{flex:1}
        .q .guide{margin-top:8px;color:#64748b;font-size:.88rem}
    </style>
  <meta name="description" content="VEYRA is an AI powered hiring platform. Recruiters post jobs, screen resumes and generate interview questions, while candidates find roles and apply in minutes." />
  <link rel="icon" type="image/svg+xml" href="/assets/brand/favicon.svg" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="VEYRA" />
  <meta property="og:title" content="Interview questions – VEYRA" />
  <meta property="og:description" content="VEYRA is an AI powered hiring platform. Recruiters post jobs, screen resumes and generate interview questions, while candidates find roles and apply in minutes." />
  <meta property="og:url" content="https://veyra-sand.vercel.app/questions.html" />
  <meta property="og:image" content="https://veyra-sand.vercel.app/assets/brand/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Interview questions – VEYRA" />
  <meta name="twitter:description" content="VEYRA is an AI powered hiring platform. Recruiters post jobs, screen resumes and generate interview questions, while candidates find roles and apply in minutes." />
  <meta name="twitter:image" content="https://veyra-sand.vercel.app/assets/brand/og-image.png" />
</head>
<body class="theme-recruiter">
    <script src="js/brand.js"></script>
    <script>showPageLoader(); window.addEventListener('load', hidePageLoader);</script>
    <div id="content" class="d-content">
        <section class="d-panel" aria-label="Interview questions">
            <div class="d-panel-head">
                <div><h3 id="title">Interview questions</h3><p class="sub" id="meta">Built from the applicant's matched skills and gaps</p></div>
                <div class="row">
                    <a class="btn btn-secondary btn-sm" id="back-link" href="jobs.html">Back to applicant</a>
                    <a class="btn btn-secondary btn-sm" id="interview-link" href="applicant-detail.html">Schedule interview</a>
                    <button class="btn btn-secondary btn-sm" id="copy-btn" type="button">Copy all</button>
                    <button class="btn btn-sm" id="generate-btn" type="button">Generate questions</button>
                </div>
            </div>
            <div id="error-box" class="form-error hidden" role="alert"></div>
            <div id="list"></div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/illustrations.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/mock.js"></script>
    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/recruiter-nav.js"></script>
    <script>
        const user = mountRecruiterShell('Interview questions', 'Prepare for the conversation', 'jobs.html');
        const applicationId = new URLSearchParams(window.location.search).get('id');
        const LEVELS = [['beginner', 'Beginner'], ['intermediate', 'Intermediate'], ['advanced', 'Advanced']];
        let questions = [];

        function el(id) { return document.getElementById(id); }

        function showBox(id, message)
        {
            el(id).textContent = message || '';
            el(id).classList.toggle('hidden', !message);
        }

        function questionHtml(q)
        {
            return '<div class="q" data-q="' + q.id + '"><div class="q-top">' +
                (q.skill ? '<span class="d-badge info">' + Dash.esc(q.skill) + '</span>' : '<span class="d-badge neutral">General</span>') +
                '<span class="spacer"></span>' +
                '<button class="btn btn-secondary btn-sm" type="button" data-regen="' + q.id + '">Regenerate</button></div>' +
                '<p>' + Dash.esc(q.text) + '</p>' +
                (q.guideline ? '<div class="guide"><b>Answer guideline:</b> ' + Dash.esc(q.guideline) + '</div>' : '') +
                '</div>';
        }

        function render()
        {
            el('generate-btn').disabled = questions.length > 0;

            if (!questions.length)
            {
                el('list').innerHTML = Dash.empty('help-circle', 'No questions yet. Select Generate questions to create a set from the assessment.');
                Dash.icons();
                return;
            }

            let html = '';

            LEVELS.forEach(function (pair)
            {
                const group = questions.filter(function (q) { return q.level === pair[0]; });

                if (group.length)
                {
                    html += '<h4 style="margin:14px 0 8px">' + pair[1] + '</h4>' + group.map(questionHtml).join('');
                }
            });

            const other = questions.filter(function (q) { return LEVELS.every(function (pair) { return pair[0] !== q.level; }); });

            if (other.length)
            {
                html += '<h4 style="margin:14px 0 8px">Other</h4>' + other.map(questionHtml).join('');
            }

            el('list').innerHTML = html;
            Dash.icons();
        }

        async function load()
        {
            if (!applicationId)
            {
                showBox('error-box', 'Open this page from an applicant.');
                return;
            }

            const base = '/api/applications/' + encodeURIComponent(applicationId);
            el('list').innerHTML = Dash.skeletons(3);
            el('back-link').href = 'applicant-detail.html?id=' + encodeURIComponent(applicationId);
            el('interview-link').href = 'applicant-detail.html?id=' + encodeURIComponent(applicationId);

            try
            {
                const results = await Promise.all([Api.get(base), Api.get(base + '/questions')]);
                const job = await Api.get('/api/jobs/' + results[0].jobId);
                el('title').textContent = 'Questions for ' + results[0].candidateName;
                el('meta').textContent = job.title + '. Built from matched skills and gaps';
                questions = results[1];
                render();
            }
            catch (error)
            {
                el('list').innerHTML = '';
                showBox('error-box', error.message);
            }
        }

        async function generate()
        {
            const button = el('generate-btn');
            Dash.setBusy(button, true);
            showBox('error-box', '');

            try
            {
                questions = await Api.post('/api/applications/' + encodeURIComponent(applicationId) + '/questions/generate');
                showToast('Questions generated.', 'success');
            }
            catch (error)
            {
                showBox('error-box', error.message);
            }

            Dash.setBusy(button, false);
            render();
        }

        async function regenerateOne(id, button)
        {
            showBox('error-box', '');
            Dash.setBusy(button, true);

            try
            {
                const updated = await Api.post('/api/questions/' + encodeURIComponent(id) + '/regenerate');
                questions = questions.map(function (q) { return q.id === updated.id ? updated : q; });
                render();
                showToast('Question regenerated.', 'success');
            }
            catch (error)
            {
                showBox('error-box', error.message);
                Dash.setBusy(button, false);
            }
        }

        function copyAll()
        {
            const text = questions.map(function (q, i) { return (i + 1) + '. [' + q.level + (q.skill ? ', ' + q.skill : '') + '] ' + q.text; }).join('\n');

            if (!navigator.clipboard)
            {
                showToast('Copy is not available in this browser.', 'error');
                return;
            }

            navigator.clipboard.writeText(text).then(function () { showToast('Questions copied.', 'success'); }, function () { showToast('Could not copy the questions.', 'error'); });
        }

        if (user)
        {
            el('generate-btn').addEventListener('click', generate);
            el('copy-btn').addEventListener('click', copyAll);
            el('list').addEventListener('click', function (event)
            {
                const button = event.target.closest('[data-regen]');

                if (button)
                {
                    regenerateOne(Number(button.getAttribute('data-regen')), button);
                }
            });
            load();
        }
    </script>
</body>
</html>
