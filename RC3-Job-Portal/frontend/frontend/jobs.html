<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jobs – VEYRA</title>
    <meta name="theme-color" content="#FAF9F6" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#11132F" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#171A45">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/jobs.css">
    <link rel="stylesheet" href="css/hero.css">
    <link rel="stylesheet" href="css/polish.css">
  <meta name="description" content="VEYRA is an AI powered hiring platform. Recruiters post jobs, screen resumes and generate interview questions, while candidates find roles and apply in minutes." />
  <link rel="icon" type="image/svg+xml" href="/assets/brand/favicon.svg" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="VEYRA" />
  <meta property="og:title" content="Jobs – VEYRA" />
  <meta property="og:description" content="VEYRA is an AI powered hiring platform. Recruiters post jobs, screen resumes and generate interview questions, while candidates find roles and apply in minutes." />
  <meta property="og:url" content="https://veyra-sand.vercel.app/jobs.html" />
  <meta property="og:image" content="https://veyra-sand.vercel.app/assets/brand/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Jobs – VEYRA" />
  <meta name="twitter:description" content="VEYRA is an AI powered hiring platform. Recruiters post jobs, screen resumes and generate interview questions, while candidates find roles and apply in minutes." />
  <meta name="twitter:image" content="https://veyra-sand.vercel.app/assets/brand/og-image.png" />
</head>
<body class="theme-recruiter">
    <script src="js/brand.js"></script>
    <script>showPageLoader(); window.addEventListener('load', hidePageLoader);</script>
    <div id="content" class="d-content">
        <div class="page-header hero-band">
            <div class="hero-art" aria-hidden="true"><img src="assets/illustrations/jobs-hero.png" alt="" decoding="async"></div>
            <div>
                <h2>Job postings</h2>
                <p class="muted">Create roles, review applicants and control which postings are live</p>
            </div>
            <a class="btn btn-accent" href="job-form.html"><i data-lucide="plus"></i>Post a job</a>
        </div>

        <section class="d-panel" aria-label="All jobs">
            <div class="d-toolbar">
                <div class="d-field">
                    <label for="filter-text">Search jobs</label>
                    <input type="search" id="filter-text" placeholder="Title, department or location" autocomplete="off">
                </div>
                <div class="d-field">
                    <span class="jb-label" id="status-label">Status</span>
                    <div class="jb-chips" id="status-chips" role="group" aria-labelledby="status-label">
                        <button type="button" class="jb-fchip" data-status="all" aria-pressed="true">All <span class="jb-count">0</span></button>
                        <button type="button" class="jb-fchip" data-status="open" aria-pressed="false">Open <span class="jb-count">0</span></button>
                        <button type="button" class="jb-fchip" data-status="closed" aria-pressed="false">Closed <span class="jb-count">0</span></button>
                    </div>
                </div>
                <div class="d-field">
                    <label for="sort-by">Sort by</label>
                    <select id="sort-by" class="jp-select">
                        <option value="applicants">Most applicants</option>
                        <option value="title">Title A to Z</option>
                        <option value="status">Open first</option>
                    </select>
                </div>
            </div>

            <p class="sub" id="summary" aria-live="polite"></p>
            <div id="jobs-list"></div>
        </section>
    </div>

    <dialog id="close-dialog" class="jb-dialog" aria-labelledby="close-title" aria-describedby="close-text">
        <div class="jb-dialog-body">
            <h3 id="close-title">Close this job?</h3>
            <p id="close-text"></p>
            <div class="jb-dialog-actions">
                <button type="button" class="btn btn-secondary btn-sm" id="close-cancel" autofocus>Keep it open</button>
                <button type="button" class="btn btn-danger btn-sm" id="close-confirm">Close job</button>
            </div>
        </div>
    </dialog>

    <script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/illustrations.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/mock.js"></script>
    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/polish.js"></script>
    <script>
        const user = guardPage('recruiter');
        const jobsList = document.getElementById('jobs-list');
        const summary = document.getElementById('summary');
        const filterText = document.getElementById('filter-text');
        const sortBy = document.getElementById('sort-by');
        const statusChips = document.getElementById('status-chips');
        const closeDialog = document.getElementById('close-dialog');
        const closeTitle = document.getElementById('close-title');
        const closeText = document.getElementById('close-text');
        const closeCancel = document.getElementById('close-cancel');
        const closeConfirm = document.getElementById('close-confirm');
        const DOTS = '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>';
        let jobs = [];
        let statusFilter = 'all';
        let changedId = '';
        let dialogJobId = '';
        let mostApplicants = 1;

        function attrEsc(value)
        {
            return Dash.esc(String(value)).replace(/"/g, '&quot;');
        }

        function findJob(jobId)
        {
            for (let i = 0; i < jobs.length; i++)
            {
                if (String(jobs[i].id) === String(jobId))
                {
                    return jobs[i];
                }
            }

            return null;
        }

        function statusCounts()
        {
            const counts = { all: jobs.length, open: 0, closed: 0 };

            jobs.forEach(function (job)
            {
                if (job.status === 'open')
                {
                    counts.open++;
                }
                else
                {
                    counts.closed++;
                }
            });

            return counts;
        }

        function renderChips()
        {
            const counts = statusCounts();

            statusChips.querySelectorAll('button[data-status]').forEach(function (button)
            {
                const status = button.getAttribute('data-status');
                button.setAttribute('aria-pressed', String(status === statusFilter));
                button.querySelector('.jb-count').textContent = counts[status];
            });
        }

        function applyFilters()
        {
            const term = filterText.value.trim().toLowerCase();

            const found = jobs.filter(function (job)
            {
                if (statusFilter !== 'all' && job.status !== statusFilter)
                {
                    return false;
                }

                if (!term)
                {
                    return true;
                }

                return [job.title, job.department, job.location].join(' ').toLowerCase().indexOf(term) !== -1;
            });

            const sort = sortBy.value;

            // copy first so the original order of jobs is never touched
            return found.slice().sort(function (a, b)
            {
                if (sort === 'title')
                {
                    return String(a.title).localeCompare(String(b.title));
                }

                if (sort === 'status')
                {
                    return (a.status === 'open' ? 0 : 1) - (b.status === 'open' ? 0 : 1);
                }

                return (Number(b.applicantCount) || 0) - (Number(a.applicantCount) || 0);
            });
        }

        function iconFor(title)
        {
            const t = String(title || '').toLowerCase();

            if (t.indexOf('analy') !== -1 || t.indexOf('data') !== -1)
            {
                return 'bar-chart-3';
            }

            if (t.indexOf('develop') !== -1 || t.indexOf('engineer') !== -1)
            {
                return 'code-2';
            }

            return 'briefcase';
        }

        function rowHtml(job, index)
        {
            const open = job.status === 'open';
            const id = encodeURIComponent(job.id);
            const idAttr = attrEsc(job.id);
            const titleAttr = attrEsc(job.title);
            const count = Number(job.applicantCount) || 0;
            const flash = changedId && String(job.id) === String(changedId) ? ' jb-flash' : '';

            return '<li class="jp-card' + (open ? ' is-open' : '') + flash + '" data-job="' + idAttr + '" style="--i:' + index + '">' +
                '<div class="jp-icon"><i data-lucide="' + iconFor(job.title) + '"></i></div>' +
                '<div class="jp-main"><strong>' + Dash.esc(job.title) + '</strong>' +
                    '<div class="jp-meta">' +
                        '<span><i data-lucide="building-2"></i>' + Dash.esc(job.department || 'No department') + '</span>' +
                        '<span><i data-lucide="map-pin"></i>' + Dash.esc(job.location || 'No location') + '</span>' +
                        (job.type ? '<span><i data-lucide="clock"></i>' + Dash.esc(job.type) + '</span>' : '') +
                    '</div>' +
                '</div>' +
                '<div class="jp-apps">' +
                    '<a href="applicants.html?jobId=' + id + '" aria-label="' + count + (count === 1 ? ' applicant' : ' applicants') + ' for ' + titleAttr + '"><b>' + count + '</b><small>' + (count === 1 ? 'applicant' : 'applicants') + '</small></a>' +
                    '<div class="jp-bar"><i style="--w:' + Math.round((count / mostApplicants) * 100) + '%"></i></div>' +
                '</div>' +
                '<div class="jp-status"><span class="jp-live' + (open ? '' : ' is-closed') + '">' + (open ? 'Open' : 'Closed') + '</span></div>' +
                '<div class="jb-act"><div class="jb-menu-wrap">' +
                    '<button type="button" class="jb-more" data-menu="' + idAttr + '" aria-haspopup="menu" aria-expanded="false" aria-label="Actions for ' + titleAttr + '">' + DOTS + '</button>' +
                    '<div class="jb-menu" role="menu" aria-label="Actions for ' + titleAttr + '" hidden>' +
                        '<a role="menuitem" href="job-form.html?id=' + id + '">Edit job</a>' +
                        '<button type="button" role="menuitem" class="' + (open ? 'danger' : '') + '" data-id="' + idAttr + '" data-action="' + (open ? 'close' : 'reopen') + '">' + (open ? 'Close job' : 'Reopen job') + '</button>' +
                    '</div>' +
                '</div></div>' +
                '</li>';
        }

        function closeMenus(returnFocus)
        {
            const trigger = jobsList.querySelector('.jb-more[aria-expanded="true"]');

            if (!trigger)
            {
                return;
            }

            trigger.setAttribute('aria-expanded', 'false');
            trigger.parentNode.querySelector('.jb-menu').hidden = true;

            if (returnFocus)
            {
                trigger.focus();
            }
        }

        function openMenu(trigger)
        {
            closeMenus(false);
            trigger.setAttribute('aria-expanded', 'true');

            const menu = trigger.parentNode.querySelector('.jb-menu');
            menu.hidden = false;
            menu.querySelector('[role="menuitem"]').focus();
        }

        function focusMenuButton(jobId)
        {
            const buttons = jobsList.querySelectorAll('.jb-more');

            for (let i = 0; i < buttons.length; i++)
            {
                if (buttons[i].getAttribute('data-menu') === String(jobId))
                {
                    buttons[i].focus();
                    return;
                }
            }
        }

        async function setStatus(jobId, action, button)
        {
            Dash.setBusy(button, true);

            try
            {
                await Api.patch('/api/jobs/' + encodeURIComponent(jobId) + '/' + action);

                const job = findJob(jobId);

                if (job)
                {
                    job.status = action === 'close' ? 'closed' : 'open';
                }

                changedId = jobId;
                render();
                showToast(action === 'close' ? 'Job closed. Candidates can no longer apply.' : 'Job reopened. Candidates can apply again.', 'success');
                return true;
            }
            catch (error)
            {
                showToast(error.message, 'error');
                return false;
            }
            finally
            {
                Dash.setBusy(button, false);
            }
        }

        function askClose(job)
        {
            const count = Number(job.applicantCount) || 0;

            dialogJobId = String(job.id);
            closeTitle.textContent = 'Close ' + job.title + '?';
            closeText.textContent = count > 0
                ? 'This job has ' + count + (count === 1 ? ' applicant' : ' applicants') + '. Closing it stops new applications, and you can reopen it at any time.'
                : 'Closing it stops new applications, and you can reopen it at any time.';
            closeDialog.showModal();
        }

        function render()
        {
            renderChips();

            if (!jobs.length)
            {
                summary.textContent = '';
                jobsList.innerHTML = Dash.empty('briefcase', 'You have not posted any jobs yet.', '<a class="btn btn-sm" href="job-form.html"><i data-lucide="plus"></i>Post your first job</a>');
                Dash.icons();
                return;
            }

            // the busiest job sets the 100 percent mark for every applicant bar
            mostApplicants = Math.max.apply(null, jobs.map(function (job) { return Number(job.applicantCount) || 0; }).concat(1));

            const filtered = applyFilters();

            summary.textContent = filtered.length + (filtered.length === 1 ? ' job' : ' jobs') + ' shown';

            if (!filtered.length)
            {
                jobsList.innerHTML = Dash.empty('search', 'No jobs match your filters.', '<button class="btn btn-secondary btn-sm" type="button" id="clear-filters">Clear filters</button>');

                document.getElementById('clear-filters').addEventListener('click', function ()
                {
                    filterText.value = '';
                    statusFilter = 'all';
                    render();
                    filterText.focus();
                });

                Dash.icons();
                return;
            }

            jobsList.innerHTML = '<ul class="jp-list">' + filtered.map(rowHtml).join('') + '</ul>';

            changedId = '';
            Dash.icons();
        }

        async function load()
        {
            summary.textContent = '';
            jobsList.innerHTML = Dash.skeletons(3);

            try
            {
                jobs = await Api.get('/api/jobs');
                render();
            }
            catch (error)
            {
                jobs = [];
                renderChips();
                Dash.failInto(jobsList, error.message, load);
            }

            Dash.icons();
        }

        function showFlash()
        {
            try
            {
                const message = sessionStorage.getItem('soryn-flash');

                if (message)
                {
                    sessionStorage.removeItem('soryn-flash');
                    showToast(message, 'success');
                }
            }
            catch (error)
            {
            }
        }

        if (user)
        {
            filterText.addEventListener('input', render);
            sortBy.addEventListener('change', render);

            statusChips.addEventListener('click', function (event)
            {
                const button = event.target.closest('button[data-status]');

                if (!button)
                {
                    return;
                }

                statusFilter = button.getAttribute('data-status');
                render();
            });

            jobsList.addEventListener('click', function (event)
            {
                const trigger = event.target.closest('.jb-more');

                if (trigger)
                {
                    if (trigger.getAttribute('aria-expanded') === 'true')
                    {
                        closeMenus(true);
                    }
                    else
                    {
                        openMenu(trigger);
                    }

                    return;
                }

                const button = event.target.closest('button[data-action]');

                if (!button)
                {
                    return;
                }

                const jobId = button.getAttribute('data-id');
                const action = button.getAttribute('data-action');

                closeMenus(false);

                if (action === 'reopen')
                {
                    setStatus(jobId, 'reopen', button);
                    return;
                }

                const job = findJob(jobId);

                if (job)
                {
                    askClose(job);
                }
            });

            jobsList.addEventListener('keydown', function (event)
            {
                const trigger = event.target.closest('.jb-more');

                if (trigger && event.key === 'ArrowDown')
                {
                    event.preventDefault();
                    openMenu(trigger);
                    return;
                }

                const menu = event.target.closest('.jb-menu');

                if (!menu)
                {
                    return;
                }

                const items = Array.prototype.slice.call(menu.querySelectorAll('[role="menuitem"]'));
                const at = items.indexOf(document.activeElement);

                if (event.key === 'ArrowDown')
                {
                    event.preventDefault();
                    items[(at + 1) % items.length].focus();
                }
                else if (event.key === 'ArrowUp')
                {
                    event.preventDefault();
                    items[(at - 1 + items.length) % items.length].focus();
                }
                else if (event.key === 'Home')
                {
                    event.preventDefault();
                    items[0].focus();
                }
                else if (event.key === 'End')
                {
                    event.preventDefault();
                    items[items.length - 1].focus();
                }
                else if (event.key === 'Escape')
                {
                    event.preventDefault();
                    closeMenus(true);
                }
                else if (event.key === 'Tab')
                {
                    closeMenus(false);
                }
            });

            document.addEventListener('click', function (event)
            {
                if (!event.target.closest('.jb-menu-wrap'))
                {
                    closeMenus(false);
                }
            });

            closeCancel.addEventListener('click', function ()
            {
                closeDialog.close();
            });

            closeConfirm.addEventListener('click', async function ()
            {
                const job = findJob(dialogJobId);

                if (job)
                {
                    await setStatus(job.id, 'close', closeConfirm);
                }

                closeDialog.close();
            });

            closeDialog.addEventListener('click', function (event)
            {
                if (event.target === closeDialog)
                {
                    closeDialog.close();
                }
            });

            closeDialog.addEventListener('close', function ()
            {
                focusMenuButton(dialogJobId);
            });

            Dash.mountShell(
            {
                user: user,
                logo: 'sparkles',
                title: 'Jobs',
                subtitle: 'Manage your job postings',
                search: true,
                items: Dash.RECRUITER_NAV,
                active: 'jobs.html',
                onBell: function ()
                {
                    showToast('You have no new notifications.', 'info');
                }
            });

            load().then(showFlash);
        }
    </script>
</body>
</html>
